<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks | Satolab.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Noto+Sans+JP:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0B0D12; color:#F2F1ED; font-family:'Noto Sans JP',sans-serif; font-weight:300;
    text-align:center; padding:40px;
  }
  h1{ font-family:'Zen Old Mincho',serif; font-weight:700; font-size:clamp(30px,6vw,48px); margin:0 0 18px; }
  p{ color:#9CA0AC; max-width:440px; line-height:1.8; margin:0 0 34px; }
  a{
    font-family:'JetBrains Mono',monospace; font-size:13px; color:#C9A15A; text-decoration:none;
    border:1px solid rgba(255,255,255,0.2); padding:12px 26px; border-radius:999px;
    transition: border-color .25s ease, color .25s ease;
  }
  a:hover{ border-color:#C9A15A; }
</style>
</head>
<body>
  <h1>ありがとうございました。</h1>
  <p>メッセージを受け取りました。折り返しご連絡いたします。</p>
  <a href="/">← トップに戻る</a>
